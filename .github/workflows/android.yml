name: Flutter CI with Rust (ncore)

on:
  workflow_dispatch:
  push: 
    branches: [ "main" ]
    paths:
      - "lib/**"
      - "neko/**"
      - "pubspec.yaml"
      - "l10n.yaml"
      - "android/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "lib/**"
      - "neko/**"
      - "pubspec.yaml"
      - "l10n.yaml"
      - "android/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    env:       
      NDK_VERSION: r29
      ANDROID_NDK_API_LEVEL: "28"
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    
    steps:
      - uses: actions/checkout@v5

      - name: Cache Flutter Pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: flutter-pub-

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('neko/**/Cargo.toml', 'neko/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_NDK_HOME }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Install the Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          curl -fSL --retry 3 -o ndk.zip "$url"
          rm -rf "$ANDROID_NDK_HOME" android-ndk-"$NDK_VERSION"
          unzip -q ndk.zip
          mv android-ndk-"$NDK_VERSION" "$ANDROID_NDK_HOME"
          rm -f ndk.zip

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
